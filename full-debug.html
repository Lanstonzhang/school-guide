<!DOCTYPE html>
<html>
<head>
    <title>完整调试页面</title>
    <style>
        body { font-family: monospace; margin: 20px; }
        .section { margin: 20px 0; padding: 15px; border: 1px solid #ccc; }
        .success { background: #d4edda; }
        .error { background: #f8d7da; }
        .warning { background: #fff3cd; }
        pre { background: #f8f9fa; padding: 10px; overflow: auto; }
        #console { background: #000; color: #0f0; padding: 10px; height: 300px; overflow-y: scroll; }
    </style>
</head>
<body>
    <h1>学校数据显示完整调试</h1>
    
    <div class="section">
        <h2>1. 加载外部脚本</h2>
        <button onclick="loadScripts()">加载学校数据脚本</button>
        <div id="script-status">未加载</div>
    </div>
    
    <div class="section">
        <h2>2. 数据检查</h2>
        <button onclick="checkData()">检查学校数据</button>
        <div id="data-status">未检查</div>
    </div>
    
    <div class="section">
        <h2>3. 显示测试</h2>
        <button onclick="testDisplay()">测试学校显示</button>
        <div id="display-status">未测试</div>
    </div>
    
    <div class="section">
        <h2>4. 控制台输出</h2>
        <div id="console"></div>
    </div>
    
    <script>
        const consoleDiv = document.getElementById('console');
        
        function log(message, type = 'info') {
            const timestamp = new Date().toLocaleTimeString();
            const prefix = type === 'error' ? '❌' : type === 'success' ? '✅' : 'ℹ️';
            consoleDiv.innerHTML += `[${timestamp}] ${prefix} ${message}<br>`;
            consoleDiv.scrollTop = consoleDiv.scrollHeight;
            console.log(message);
        }
        
        function loadScripts() {
            log('开始加载脚本...');
            
            // 加载学校数据
            const dataScript = document.createElement('script');
            dataScript.src = 'https://lanstonzhang.github.io/school-guide/schools-data.js';
            dataScript.onload = function() {
                log('✅ schools-data.js 加载成功');
                document.getElementById('script-status').innerHTML = '<span style="color:green">数据脚本加载成功</span>';
                
                // 加载主脚本
                const mainScript = document.createElement('script');
                mainScript.src = 'https://lanstonzhang.github.io/school-guide/script.js';
                mainScript.onload = function() {
                    log('✅ script.js 加载成功');
                    document.getElementById('script-status').innerHTML += '<br><span style="color:green">主脚本加载成功</span>';
                };
                mainScript.onerror = function() {
                    log('❌ script.js 加载失败', 'error');
                    document.getElementById('script-status').innerHTML += '<br><span style="color:red">主脚本加载失败</span>';
                };
                document.head.appendChild(mainScript);
            };
            dataScript.onerror = function() {
                log('❌ schools-data.js 加载失败', 'error');
                document.getElementById('script-status').innerHTML = '<span style="color:red">数据脚本加载失败</span>';
            };
            document.head.appendChild(dataScript);
        }
        
        function checkData() {
            log('检查学校数据...');
            
            if (typeof huizhouSchools === 'undefined') {
                log('❌ huizhouSchools 未定义', 'error');
                document.getElementById('data-status').innerHTML = '<span style="color:red">数据未定义</span>';
                return;
            }
            
            log('✅ huizhouSchools 已定义');
            
            // 统计学校
            const highCount = huizhouSchools.highSchools ? huizhouSchools.highSchools.length : 0;
            const vocationalCount = huizhouSchools.vocationalSchools ? huizhouSchools.vocationalSchools.length : 0;
            const technicalCount = huizhouSchools.technicalSchools ? huizhouSchools.technicalSchools.length : 0;
            const total = highCount + vocationalCount + technicalCount;
            
            log(`高中: ${highCount} 所`);
            log(`中专/职高: ${vocationalCount} 所`);
            log(`技工学校: ${technicalCount} 所`);
            log(`总计: ${total} 所学校`);
            
            let statusHTML = `
                <p>高中: ${highCount} 所</p>
                <p>中专/职高: ${vocationalCount} 所</p>
                <p>技工学校: ${technicalCount} 所</p>
                <p><strong>总计: ${total} 所学校</strong></p>
            `;
            
            if (total > 1) {
                statusHTML += '<p style="color:green">✅ 数据完整</p>';
                document.getElementById('data-status').className = 'success';
            } else {
                statusHTML += '<p style="color:red">⚠️ 数据可能不完整</p>';
                document.getElementById('data-status').className = 'warning';
            }
            
            document.getElementById('data-status').innerHTML = statusHTML;
        }
        
        function testDisplay() {
            log('测试学校显示...');
            
            if (typeof displaySchoolsByType !== 'function') {
                log('❌ displaySchoolsByType 函数未定义', 'error');
                document.getElementById('display-status').innerHTML = '<span style="color:red">显示函数未定义</span>';
                return;
            }
            
            log('✅ displaySchoolsByType 函数可用');
            
            // 创建测试容器
            const testContainer = document.createElement('div');
            testContainer.id = 'test-high-school-tab';
            testContainer.innerHTML = '<div class="schools-grid"></div>';
            document.body.appendChild(testContainer);
            
            // 测试显示
            try {
                displaySchoolsByType('high-school');
                log('✅ 显示函数执行成功');
                
                // 检查是否显示了学校
                const container = document.querySelector('#test-high-school-tab .schools-grid');
                if (container && container.children.length > 0) {
                    log(`✅ 显示了 ${container.children.length} 所学校`);
                    document.getElementById('display-status').innerHTML = `<span style="color:green">成功显示 ${container.children.length} 所学校</span>`;
                } else {
                    log('⚠️ 容器中没有学校卡片', 'warning');
                    document.getElementById('display-status').innerHTML = '<span style="color:orange">显示函数执行但未生成卡片</span>';
                }
            } catch (error) {
                log(`❌ 显示函数错误: ${error.message}`, 'error');
                document.getElementById('display-status').innerHTML = `<span style="color:red">显示函数错误: ${error.message}</span>`;
            }
            
            // 清理测试容器
            testContainer.remove();
        }
        
        // 自动开始
        window.onload = function() {
            log('页面加载完成');
            setTimeout(() => {
                loadScripts();
                setTimeout(checkData, 2000);
                setTimeout(testDisplay, 4000);
            }, 1000);
        };
    </script>
</body>
</html>
